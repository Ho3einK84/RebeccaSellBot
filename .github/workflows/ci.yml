name: CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rsbot_test
          POSTGRES_PASSWORD: rsbot_test
          POSTGRES_DB: rsbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsbot_test -d rsbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check deployment scripts
        run: bash -n install.sh scripts/rsbot

      - name: Enforce coverage floor
        run: npm run test:coverage

      - name: PostgreSQL integration and concurrency tests
        env:
          TEST_DATABASE_URL: postgres://rsbot_test:rsbot_test@127.0.0.1:5432/rsbot_test
          REQUIRE_INTEGRATION_DB: '1'
        run: npm run test:integration

      - name: Build production image
        run: |
          docker build --pull=false \
            --build-arg APP_GIT_BRANCH="${GITHUB_REF_TYPE:+$([ "$GITHUB_REF_TYPE" = "branch" ] && printf '%s' "$GITHUB_REF_NAME" || true)}" \
            --build-arg APP_GIT_TAG="${GITHUB_REF_TYPE:+$([ "$GITHUB_REF_TYPE" = "tag" ] && printf '%s' "$GITHUB_REF_NAME" || true)}" \
            --build-arg APP_GIT_SHA="${GITHUB_SHA}" \
            -t rebeccasellbot:ci .
