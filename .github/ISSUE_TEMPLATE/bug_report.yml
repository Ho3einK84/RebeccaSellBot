name: Bug Report
description: Report a reproducible bug or unexpected behavior
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please **do not** include real Telegram tokens, Rebecca API keys, passwords, or live customer subscription URLs in public issues.
  - type: input
    id: version
    attributes:
      label: RebeccaSellBot Version / Commit
      description: What version or git commit hash are you running? (e.g. 0.1.0 or main)
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Deployment Environment
      options:
        - Docker Compose (via install.sh / rsbot)
        - Docker Compose (manual)
        - Bare Metal / Node.js
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '/admin'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Relevant sanitized log output (redact any sensitive credentials).
      render: shell
